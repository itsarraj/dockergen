[package]
name = "dockergen"
version = "0.1.0"
edition = "2021"
description = "Generates a working multi-stage Dockerfile from your actual project — a Nixpacks alternative"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/dockergen"
readme = "README.md"
keywords = ["docker", "dockerfile", "nixpacks", "generator", "containers"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "dockergen"
path = "src/lib.rs"

[[bin]]
name = "dockergen"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
